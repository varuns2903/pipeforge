openapi: 3.0.3
info:
  title: PipeForge API
  version: '1.0'
  description: >
    REST API for PipeForge — a visual data-processing pipeline builder.
    Browser clients authenticate via an httpOnly cookie set on login/register;
    non-browser clients may instead send `Authorization: Bearer <token>`.


    Rate limiting: every route under /api (except /api/billing/webhook, which
    Stripe calls directly) is subject to a baseline per-IP limit of 600
    requests per 15 minutes. Login/register have their own much stricter
    per-IP limit (20/15min). A few endpoints that trigger real downstream
    work — running a pipeline, retrying an execution, creating a Stripe
    checkout/portal session — additionally enforce a per-*user* limit of 30
    requests/minute. Any of these return 429 with `{ "error": "..." }` and
    standard `RateLimit-*` response headers.
servers:
  - url: /api

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        myRole: { type: string, enum: [owner, editor, viewer], description: "The requesting user's access level on this project." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true, description: 'Set when soft-deleted; restorable until then.' }
    ProjectMember:
      type: object
      properties:
        userId: { type: string }
        email: { type: string, nullable: true }
        name: { type: string, nullable: true }
        role: { type: string, enum: [owner, editor, viewer] }
    Pipeline:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        nodes:
          type: array
          items: { type: object }
        edges:
          type: array
          items: { type: object }
        schedule:
          type: object
          properties:
            cronExpression: { type: string, nullable: true }
            timezone: { type: string, nullable: true }
            enabled: { type: boolean }
        notifications:
          type: object
          description: 'Email the owner when this pipeline finishes running. Set via PUT on this pipeline.'
          properties:
            onFailure: { type: boolean, description: 'Default true' }
            onComplete: { type: boolean, description: 'Default false' }
        webhook:
          type: object
          description: 'Whether an outbound webhook is configured. The signing secret is NOT included here — fetch it via GET .../webhook.'
          properties:
            configured: { type: boolean }
            url: { type: string, nullable: true }
            onFailure: { type: boolean, description: 'Default true' }
            onComplete: { type: boolean, description: 'Default false' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true, description: 'Set when soft-deleted; restorable until then.' }
    WebhookConfig:
      type: object
      nullable: true
      description: 'null when no webhook is configured for this pipeline.'
      properties:
        url: { type: string }
        secret: { type: string, description: 'HMAC-SHA256 signing secret, decrypted. Deliveries carry it as the "X-PipeForge-Signature" header: "sha256=" + hex HMAC of the raw JSON body.' }
        onFailure: { type: boolean }
        onComplete: { type: boolean }
    PlanSummary:
      type: object
      properties:
        id: { type: string, enum: [free, pro] }
        name: { type: string }
        maxStorageMB: { type: number }
        maxConcurrentExecutions: { type: integer }
    FileSummary:
      type: object
      properties:
        id: { type: string }
        filePath: { type: string }
        originalName: { type: string }
        size: { type: integer }
        createdAt: { type: string, format: date-time }
        project:
          type: object
          description: 'Only present on the cross-project GET /files aggregate, not on the project-nested GET .../files.'
          properties: { id: { type: string, nullable: true }, name: { type: string, nullable: true } }
    ExecutionSummary:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        pipeline:
          type: object
          properties: { id: { type: string, nullable: true }, name: { type: string, nullable: true } }
        project:
          type: object
          properties: { id: { type: string, nullable: true }, name: { type: string, nullable: true } }
    Execution:
      type: object
      properties:
        _id: { type: string }
        pipelineId: { type: string }
        projectId: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
        pipelineSnapshot: { type: object }
        results: { type: object }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Connection:
      type: object
      description: >
        A saved, reusable data-source connection. Credentials are encrypted
        at rest and never returned by the API after creation — only
        non-secret fields (host, bucket, baseUrl, etc.) appear in `config`.
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        type: { type: string, enum: [postgres, s3, api] }
        config: { type: object, description: 'Non-secret fields only, shape depends on type' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error: { type: string }

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: OK

  /metrics:
    get:
      summary: Prometheus scrape target (process metrics, HTTP request duration/count, pipeline executions queued)
      description: Intentionally unauthenticated, matching standard Prometheus exporter practice — a scraper carries no user session.
      security: []
      responses:
        '200':
          description: OK
          content: { text/plain: { schema: { type: string } } }

  /auth/register:
    post:
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: 'At least one letter and one number' }
                name: { type: string }
      responses:
        '201':
          description: Registered — sets the auth cookie and returns the user + token
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  token: { type: string }
        '400':
          description: Validation error or email already in use

  /auth/login:
    post:
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Signed in — sets the auth cookie and returns the user + token
        '401':
          description: Invalid credentials
        '423':
          description: Account locked after too many failed attempts

  /auth/logout:
    post:
      summary: Sign out (clears the auth cookie)
      security: []
      responses:
        '204': { description: Logged out }

  /auth/me:
    get:
      summary: Get the current authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/verify-email:
    post:
      summary: Verify an email address using the token from the verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Verified }
        '400': { description: Token invalid or expired }

  /auth/resend-verification:
    post:
      summary: Resend the verification email to the current user
      responses:
        '204': { description: Sent }
        '400': { description: Email already verified }

  /auth/forgot-password:
    post:
      summary: Request a password reset email
      security: []
      description: >
        Always returns 204 whether or not the email is registered, to avoid
        leaking which addresses have accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: A reset email was sent, if the account exists }

  /auth/reset-password:
    post:
      summary: Reset a password using the token from the reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '204': { description: Password updated }
        '400': { description: Token invalid or expired, or password fails policy }

  /projects:
    get:
      summary: List the current user's projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }

  /projects/trash:
    get:
      summary: List the current user's soft-deleted projects, for recovery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }

  /projects/{projectId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a project
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Rename a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Soft-delete a project (recoverable via restore)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/restore:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    post:
      summary: Restore a soft-deleted project
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/members:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      summary: List a project's members (owner plus invited editors/viewers)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Invite an existing user to the project by email (owner-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role: { type: string, enum: [editor, viewer] }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } } } }
        '400': { description: Invalid email/role, no such user, or already a member }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/members/{memberId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: memberId, in: path, required: true, schema: { type: string } }
    put:
      summary: Change a member's role (owner-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties: { role: { type: string, enum: [editor, viewer] } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Remove a member from the project (owner-only)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/pipelines:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      summary: List pipelines in a project
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pipeline' }
    post:
      summary: Create a pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Pipeline' } } }

  /projects/{projectId}/pipelines/trash:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      summary: List a project's soft-deleted pipelines, for recovery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pipeline' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/pipelines/{pipelineId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: pipelineId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a pipeline
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Pipeline' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update a pipeline's name, nodes, edges, and/or notification preferences
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                nodes: { type: array, items: { type: object } }
                edges: { type: array, items: { type: object } }
                notifications:
                  type: object
                  properties:
                    onFailure: { type: boolean }
                    onComplete: { type: boolean }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Pipeline' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Soft-delete a pipeline (recoverable via restore)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/pipelines/{pipelineId}/restore:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: pipelineId, in: path, required: true, schema: { type: string } }
    post:
      summary: Restore a soft-deleted pipeline
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Pipeline' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/pipelines/{pipelineId}/schedule:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: pipelineId, in: path, required: true, schema: { type: string } }
    put:
      summary: Set (or replace) a recurring cron schedule for this pipeline
      description: >
        Runs the pipeline automatically on the given cron schedule via a
        BullMQ job scheduler. Each scheduled firing looks up the pipeline
        fresh, so edits made after scheduling are picked up automatically.
        Setting a new schedule replaces any existing one for this pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cronExpression]
              properties:
                cronExpression: { type: string, description: 'Standard 5-field cron syntax, e.g. "0 * * * *"' }
                timezone: { type: string, description: 'e.g. "America/New_York"; defaults to UTC' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Pipeline' } } }
        '400': { description: Invalid cron expression }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Remove this pipeline's recurring schedule
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Pipeline' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/pipelines/{pipelineId}/webhook:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: pipelineId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get this pipeline's webhook config, with its signing secret decrypted
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/WebhookConfig' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Set (or replace) this pipeline's outbound webhook
      description: >
        POSTs a signed JSON payload to `url` when the pipeline completes
        and/or fails, per onFailure/onComplete. A signing secret is
        generated the first time a webhook is set; it's kept stable across
        further PUTs unless `regenerateSecret: true` is passed, so updating
        just the URL or event flags doesn't silently invalidate a
        receiver's existing signature verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                onFailure: { type: boolean, description: 'Default true' }
                onComplete: { type: boolean, description: 'Default false' }
                regenerateSecret: { type: boolean, description: 'Default false' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/WebhookConfig' } } }
        '400': { description: Invalid or non-http(s) URL }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Remove this pipeline's webhook
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/pipelines/{pipelineId}/validate:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: pipelineId, in: path, required: true, schema: { type: string } }
    get:
      summary: Validate a pipeline's DAG structure and node configuration
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid: { type: boolean }
                  errors: { type: array, items: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/pipelines/{pipelineId}/run:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: pipelineId, in: path, required: true, schema: { type: string } }
    post:
      summary: Queue an asynchronous execution of the pipeline
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
        '400': { description: Pipeline failed validation }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: 'Too many active executions for this user (MAX_CONCURRENT_EXECUTIONS_PER_USER)' }

  /projects/{projectId}/pipelines/{pipelineId}/executions:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: pipelineId, in: path, required: true, schema: { type: string } }
      - { name: cursor, in: query, required: false, schema: { type: string }, description: "The previous page's nextCursor, to fetch the page after it. Omit for the first page." }
      - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 100 } }
    get:
      summary: Cursor-paginated list of a pipeline's executions, most recent first (no results payload)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Execution' } }
                  nextCursor: { type: string, nullable: true, description: 'Pass as ?cursor= to fetch the next page; null when this was the last page.' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/pipelines/{pipelineId}/executions/{executionId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: pipelineId, in: path, required: true, schema: { type: string } }
      - { name: executionId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a single execution, including its results
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Execution' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/pipelines/{pipelineId}/executions/{executionId}/retry:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: pipelineId, in: path, required: true, schema: { type: string } }
      - { name: executionId, in: path, required: true, schema: { type: string } }
    post:
      summary: Re-run a past execution's exact frozen pipeline snapshot
      description: >
        Re-executes the nodes/edges captured at the time of the original
        run, not the pipeline's current definition — so a retry is an
        apples-to-apples attempt, unaffected by edits made since. Current
        notification preferences still apply.
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: 'Too many active executions for this user (MAX_CONCURRENT_EXECUTIONS_PER_USER)' }

  /projects/{projectId}/files/upload:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    post:
      summary: Upload a .csv or .json dataset to this project (used as a pipeline's csv-input/json-input source), shared with every project member
      description: Requires editor+ on the project. Storage quota is charged to the uploader personally, not the project.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  filePath: { type: string, description: 'Pass this as a csv-input/json-input node''s filePath config' }
                  originalName: { type: string }
                  size: { type: integer }
        '400': { description: 'No file, wrong type, or over the per-file size limit' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: "Would exceed the uploader's total storage quota" }

  /projects/{projectId}/files:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      summary: List this project's uploaded datasets (viewer+)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FileSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/files/{fileId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: fileId, in: path, required: true, schema: { type: string } }
    delete:
      summary: Delete an uploaded dataset (editor+; frees the uploader's storage quota)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /files:
    get:
      summary: List every dataset uploaded to any project the current user can see (owner or member), across projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FileSummary' }

  /executions:
    parameters:
      - { name: cursor, in: query, required: false, schema: { type: string }, description: "The previous page's nextCursor, to fetch the page after it. Omit for the first page." }
      - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 100 } }
    get:
      summary: Cursor-paginated list of every execution the current user has personally triggered, across all their projects
      description: Does not include executions run by teammates in a shared project — see the activity log for that.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ExecutionSummary' } }
                  nextCursor: { type: string, nullable: true, description: 'Pass as ?cursor= to fetch the next page; null when this was the last page.' }

  /projects/{projectId}/connections:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      summary: List this project's saved connections (viewer+), shared with every member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Connection' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a saved connection (Postgres, S3, or a generic API) in this project (editor+)
      description: >
        `secret` holds whatever's sensitive for the type and is encrypted at
        rest, never returned by any endpoint: `{ password }` for postgres,
        `{ accessKeyId, secretAccessKey }` for s3, `{ token }` for api.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, config, secret]
              properties:
                name: { type: string }
                type: { type: string, enum: [postgres, s3, api] }
                config: { type: object }
                secret: { type: object }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } }
        '400': { description: Missing required fields for the given type }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/connections/{connectionId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: connectionId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a connection (viewer+; never includes the secret)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a connection (editor+)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /usage:
    get:
      summary: Get the current user's quota usage (storage and concurrent executions)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: { type: string, enum: [free, pro] }
                  storage:
                    type: object
                    properties:
                      usedBytes: { type: integer }
                      limitBytes: { type: integer, description: "The user's plan storage limit, in bytes" }
                  executions:
                    type: object
                    properties:
                      active: { type: integer, description: 'Count of PENDING/RUNNING executions' }
                      limit: { type: integer, description: "The user's plan concurrent-execution limit" }

  /billing/plan:
    get:
      summary: Get the current user's plan, subscription status, and all available plans
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: { type: string, enum: [free, pro] }
                  subscriptionStatus: { type: string, nullable: true, description: 'Raw Stripe subscription status (active, past_due, canceled, ...), null if never subscribed' }
                  limits: { $ref: '#/components/schemas/PlanSummary' }
                  plans:
                    type: array
                    items: { $ref: '#/components/schemas/PlanSummary' }

  /billing/checkout:
    post:
      summary: Create a Stripe Checkout session to upgrade to Pro
      description: Creates (or reuses) a Stripe customer for the user, then a subscription Checkout session for the Pro plan. Redirect the browser to the returned URL.
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { url: { type: string } } } } }

  /billing/portal:
    post:
      summary: Create a Stripe billing portal session (manage payment method, view invoices, cancel)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { url: { type: string } } } } }
        '400': { description: 'User has no billing account yet (has never checked out)' }

  /billing/webhook:
    post:
      summary: Stripe webhook receiver (not authenticated with a user session — verified via the Stripe-Signature header instead)
      responses:
        '200': { description: Event processed }
        '400': { description: Missing or invalid Stripe-Signature header }

# Production-shaped compose file: builds and runs the full stack (web, api,
# worker, mongo, redis). Dev-only workflow still uses docker-compose.yml
# (just the databases) alongside `npm run dev` in each app.
#
# Usage:
#   cp .env.example .env   # then fill in real values, especially JWT_SECRET
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  mongodb:
    image: mongo:6
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      - mongodb
      - redis
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/pipeforge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CONNECTION_ENCRYPTION_KEY: ${CONNECTION_ENCRYPTION_KEY:?CONNECTION_ENCRYPTION_KEY must be set in .env}
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
    volumes:
      - uploads_data:/repo/uploads
    ports:
      - '3000:3000'
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      - mongodb
      - redis
    environment:
      MONGODB_URI: mongodb://mongodb:27017/pipeforge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CONNECTION_ENCRYPTION_KEY: ${CONNECTION_ENCRYPTION_KEY:?CONNECTION_ENCRYPTION_KEY must be set in .env}
    volumes:
      - uploads_data:/repo/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - '5173:80'
    restart: unless-stopped

  # Scrapes api's and worker's /metrics endpoints (see apps/*/src/metrics.ts)
  # and evaluates monitoring/prometheus/alert_rules.yml. Alerts are visible
  # under Prometheus's own Alerts page; wiring a notification channel
  # (Alertmanager, Slack, PagerDuty, etc.) is a deploy-specific choice left
  # to whoever operates this stack.
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - worker
    ports:
      - '9090:9090'
    restart: unless-stopped

  # Pre-provisioned with the Prometheus datasource and the "PipeForge
  # Overview" dashboard (monitoring/grafana/) — no manual setup needed after
  # first boot. Default login is admin/admin; change GRAFANA_ADMIN_PASSWORD.
  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - '3001:3000'
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  uploads_data:
  prometheus_data:
  grafana_data:

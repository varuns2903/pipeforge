global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: pipeforge-api
    static_configs:
      - targets: ['api:3000']
    metrics_path: /metrics

  - job_name: pipeforge-worker
    static_configs:
      - targets: ['worker:9091']
    metrics_path: /metrics

# Templated at container startup by docker-entrypoint.sh — the __PLACEHOLDER__
# tokens below are substituted from environment variables (see
# docker-compose.prod.yml). This file is never used directly; the rendered
# copy lives at /tmp/alertmanager.yml inside the container.
route:
  receiver: '__DEFAULT_RECEIVER__'
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Valid Alertmanager receiver with no integrations — matched alerts are
  # simply dropped. Used when neither Slack nor email is configured, so the
  # stack still starts cleanly instead of failing on an empty webhook/SMTP
  # config.
  - name: 'blackhole'

  - name: 'slack'
    slack_configs:
      - api_url: '__SLACK_WEBHOOK_URL__'
        channel: '#alerts'
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'
        send_resolved: true

  - name: 'email'
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        from: '__SMTP_FROM__'
        smarthost: '__SMTP_HOST__:__SMTP_PORT__'
        auth_username: '__SMTP_USER__'
        auth_password: '__SMTP_PASS__'
        require_tls: true
        send_resolved: true

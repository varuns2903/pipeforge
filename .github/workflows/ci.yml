name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017/pipeforge_test
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      JWT_SECRET: ci_test_secret_do_not_use_in_prod
      CONNECTION_ENCRYPTION_KEY: ci_test_encryption_key_do_not_use_in_prod
      WEB_URL: http://localhost:5173
      VITE_API_URL: http://localhost:3000
      TEST_PG_HOST: localhost
      TEST_PG_PORT: 55432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Seed test Postgres (used by pipeline-engine's postgres-input tests)
        run: |
          PGPASSWORD=testpass psql -h localhost -p 55432 -U postgres -d testdb -c "
            CREATE TABLE users (id SERIAL PRIMARY KEY, name TEXT, age INT);
            INSERT INTO users (name, age) VALUES ('Alice', 28), ('Bob', 17), ('Charlie', 34);
          "

      - name: Build shared packages
        run: |
          npm run build -w @pipeforge/shared
          npm run build -w @pipeforge/pipeline-engine

      - name: Typecheck api
        run: npx tsc --noEmit -p apps/api

      - name: Typecheck worker
        run: npx tsc --noEmit -p apps/worker

      - name: Lint web
        run: npm run lint -w @pipeforge/web

      - name: Test pipeline-engine
        run: npm run test -w @pipeforge/pipeline-engine

      - name: Test api
        run: npm run test -w @pipeforge/api

      - name: Build web
        run: npm run build -w @pipeforge/web

      - name: Build api
        run: npm run build -w @pipeforge/api

      - name: Build worker
        run: npm run build -w @pipeforge/worker

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t pipeforge-api:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t pipeforge-worker:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t pipeforge-web:ci .

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    env:
      MONGODB_URI: mongodb://localhost:27017/pipeforge_e2e
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      JWT_SECRET: ci_test_secret_do_not_use_in_prod
      CONNECTION_ENCRYPTION_KEY: ci_test_encryption_key_do_not_use_in_prod
      WEB_URL: http://localhost:5173
      VITE_API_URL: http://localhost:3000
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @pipeforge/shared
          npm run build -w @pipeforge/pipeline-engine

      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Start api, worker, web in the background
        run: |
          npx tsx apps/api/src/index.ts > api.log 2>&1 &
          npx tsx apps/worker/src/index.ts > worker.log 2>&1 &
          npm run dev -w @pipeforge/web -- --port 5173 > web.log 2>&1 &

      - name: Wait for the stack to be ready
        run: |
          for url in http://localhost:3000/healthz http://localhost:5173; do
            echo "Waiting for $url..."
            timeout 60 bash -c "until curl -sf $url > /dev/null; do sleep 1; done"
          done

      - name: Run E2E tests
        run: npm test
        working-directory: tests/e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "--- api.log ---"; cat api.log || true
          echo "--- worker.log ---"; cat worker.log || true
          echo "--- web.log ---"; cat web.log || true
